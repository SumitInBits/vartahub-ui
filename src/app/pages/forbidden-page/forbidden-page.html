<div class="flex min-h-[calc(100vh-64px)] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
  <mat-card appearance="outlined" class="w-full max-w-2xl">
    <mat-card-content class="px-6 py-12 sm:px-12 sm:py-16">
      <div class="flex flex-col items-center text-center">
        <!-- Icon -->
        <div
          class="mb-7 flex h-24 w-24 items-center justify-center rounded-full bg-error-container sm:h-28 sm:w-28"
        >
          <mat-icon
            class="h-14!  text-[56px]! text-error"
          >
            block
          </mat-icon>
        </div>

        <!-- Status -->
        <p class="text-sm font-semibold tracking-widest text-on-surface-variant uppercase">
          Error 403
        </p>

        <!-- Heading -->
        <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">
          Access forbidden
        </h1>

        <!-- Description -->
        <p
          class="mt-4 max-w-xl text-sm leading-6 text-on-surface-variant sm:text-base"
        >
          You don't have permission to access this page. Your account may not
          have the required role or permissions.
        </p>

        <!-- Actions -->
        <div class="mt-9 flex w-full flex-col gap-3 sm:w-auto sm:flex-row">
          <a
            mat-flat-button
            routerLink="/"
            class="w-full sm:w-auto"
          >
            <mat-icon>home</mat-icon>
            Go to home
          </a>

          <button
            mat-button
            type="button"
            class="w-full sm:w-auto"
            (click)="goBack()"
          >
            <mat-icon>arrow_back</mat-icon>
            Go back
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
