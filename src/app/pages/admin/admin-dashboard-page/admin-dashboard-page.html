<div class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-8">
  <!-- Page Header -->
  <div class="flex flex-col gap-1">
    <h1 class="text-3xl font-extrabold tracking-tight text-on-surface">Admin Dashboard</h1>
    <p class="text-on-surface-variant text-sm md:text-base">
      Select a module below to manage platform data, configurations, and users.
    </p>
  </div>

  <!-- Grid Layout -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (module of adminModules; track module.title) {
      <mat-card
        class="rounded-3xl! border border-outline-variant/60 shadow-none! bg-surface-container-low transition-all duration-200 hover:shadow-md hover:border-primary/50 group flex flex-col justify-between overflow-hidden cursor-pointer"
        [routerLink]="module.route"
      >
        <mat-card-content class="p-6 flex flex-col gap-5">
          <!-- Top Row: Icon on left, Configure action pushed to the right -->
          <div class="flex items-center justify-between">
            <div
              class="w-12 h-12 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center transition-transform group-hover:scale-110"
            >
              <mat-icon class="text-2xl">{{ module.icon }}</mat-icon>
            </div>

            <span class="text-xs font-semibold text-primary flex items-center gap-1">
              Configure
              <mat-icon class="text-sm transition-transform group-hover:translate-x-1"
                >arrow_forward</mat-icon
              >
            </span>
          </div>

          <!-- Titles & Description with added spacing from the top row -->
          <div class="mt-2 flex flex-col gap-1">
            <h2
              class="text-lg font-bold text-on-surface group-hover:text-primary transition-colors"
            >
              {{ module.title }}
            </h2>
            <p class="text-sm text-on-surface-variant leading-relaxed">
              {{ module.description }}
            </p>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
