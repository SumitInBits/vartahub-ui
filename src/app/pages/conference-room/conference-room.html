<div class="flex h-screen w-screen bg-slate-900 text-slate-100 overflow-hidden fixed inset-0">

  <!-- Main Video Grid Area -->
  <div class="flex-1 flex flex-col relative h-full overflow-hidden">

    <!-- Top Header Bar -->
    <div class="flex items-center justify-between px-6 py-3 bg-slate-800/80 backdrop-blur border-b border-slate-700 shrink-0">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-lg text-emerald-400">Vartahub Live Room</span>
        <span class="text-xs px-2 py-1 bg-emerald-900/60 text-emerald-300 rounded-full border border-emerald-700/50">
          Peer Interview Session
        </span>
      </div>

      <!-- Center: Countdown Timer & Connection Quality -->
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2 bg-slate-900/80 px-4 py-1.5 rounded-lg border border-slate-700">
          <mat-icon class="text-amber-400 text-sm">timer</mat-icon>
          <span class="font-mono text-base font-medium">{{ formattedTime }}</span>
        </div>

        <!-- Connection Quality Indicator -->
        <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700"
             matTooltip="Connection Quality: Good (Low Latency)">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <span>HD / 24ms</span>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-2">
        <button mat-stroked-button color="accent" (click)="openHelpModal()" class="flex items-center gap-1 border-slate-600 text-slate-200">
          <mat-icon>help_outline</mat-icon>
          <span>Interview Help</span>
        </button>
      </div>
    </div>

    <!-- Video Streams Container -->
    <div class="flex-1 grid grid-cols-2 gap-4 p-4 overflow-hidden relative">

      <!-- Remote Peer Video -->
      <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center shadow-lg h-full">
        <video #remoteVideo autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute bottom-4 left-4 bg-slate-900/70 backdrop-blur px-3 py-1 rounded-md text-sm font-medium">
          Peer Participant
        </div>
      </div>

      <!-- Local User Video -->
      <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 flex items-center justify-center shadow-lg h-full">
        <video #localVideo autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
        <div *ngIf="!isCameraOn" class="absolute inset-0 flex items-center justify-center bg-slate-800 text-slate-400">
          <mat-icon class="text-4xl">videocam_off</mat-icon>
        </div>
        <div class="absolute bottom-4 left-4 bg-slate-900/70 backdrop-blur px-3 py-1 rounded-md text-sm font-medium">
          You (Host/Peer)
        </div>
      </div>

    </div>

    <!-- Bottom Control Toolbar -->
    <div class="flex items-center justify-center gap-4 py-3 bg-slate-800/80 backdrop-blur border-t border-slate-700 shrink-0">
      <button mat-fab [color]="isMicOn ? 'primary' : 'warn'" (click)="toggleMic()" [matTooltip]="isMicOn ? 'Mute Mic' : 'Unmute Mic'">
        <mat-icon>{{ isMicOn ? 'mic' : 'mic_off' }}</mat-icon>
      </button>

      <button mat-fab [color]="isCameraOn ? 'primary' : 'warn'" (click)="toggleCamera()" [matTooltip]="isCameraOn ? 'Turn Camera Off' : 'Turn Camera On'">
        <mat-icon>{{ isCameraOn ? 'videocam' : 'videocam_off' }}</mat-icon>
      </button>

      <!-- New Screen Share Button -->
      <button mat-fab [color]="isScreenSharing ? 'accent' : 'primary'" (click)="toggleScreenShare()" [matTooltip]="isScreenSharing ? 'Stop Sharing Screen' : 'Share Screen'">
        <mat-icon>{{ isScreenSharing ? 'stop_screen_share' : 'screen_share' }}</mat-icon>
      </button>

      <button mat-fab color="warn" (click)="leaveCall()" matTooltip="Leave Room">
        <mat-icon>call_end</mat-icon>
      </button>

      <button mat-fab color="default" class="bg-slate-700 text-white hover:bg-slate-600" (click)="isSidebarOpen = !isSidebarOpen" matTooltip="Toggle Chat & Notes">
        <mat-icon>{{ isSidebarOpen ? 'chevron_right' : 'chat' }}</mat-icon>
      </button>
    </div>

  </div>

  <!-- Collapsible Right Sidebar (Chat & Enhanced Notes) -->
  <div *ngIf="isSidebarOpen" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col h-full overflow-hidden shrink-0">

    <!-- Sidebar Tabs Header -->
    <div class="flex border-b border-slate-700 shrink-0">
      <button class="flex-1 py-3 text-sm font-medium border-b-2"
              [ngClass]="activeTab === 'chat' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'"
              (click)="activeTab = 'chat'">
        Live Chat
      </button>
      <button class="flex-1 py-3 text-sm font-medium border-b-2"
              [ngClass]="activeTab === 'notes' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400'"
              (click)="activeTab = 'notes'">
        Session Notes
      </button>
    </div>

    <!-- Tab 1: Chat Stream -->
    <div *ngIf="activeTab === 'chat'" class="flex-1 flex flex-col justify-between overflow-hidden">
      <div class="flex-1 p-4 overflow-y-auto space-y-3">
        <div *ngFor="let msg of messages" class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
          <div class="flex justify-between text-xs text-slate-400 mb-1">
            <span class="font-semibold text-emerald-400">{{ msg.sender }}</span>
            <span>{{ msg.time }}</span>
          </div>
          <p class="text-sm text-slate-200">{{ msg.text }}</p>
        </div>
      </div>

      <!-- Message Input -->
      <div class="p-3 border-t border-slate-700 flex gap-2 shrink-0 bg-slate-800">
        <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Type a message..."
               class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500" />
        <button mat-flat-button color="primary" (click)="sendMessage()">Send</button>
      </div>
    </div>

    <!-- Tab 2: Enhanced Session Notes / Feedback Pad -->
    <div *ngIf="activeTab === 'notes'" class="flex-1 flex flex-col p-4 overflow-hidden">
      <label class="text-xs text-slate-400 mb-2">Private Notes & Evaluation Feedback (Auto-saved)</label>
      <textarea [(ngModel)]="sessionNotes" placeholder="Jot down code feedback, strengths, areas of improvement..."
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 resize-none focus:outline-none focus:border-emerald-500"></textarea>
    </div>

  </div>

</div>
