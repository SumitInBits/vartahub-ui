<!-- Navbar -->
<mat-toolbar class="relative z-40 border-b border-slate-200 bg-white">
  <!-- Left -->
  <div class="flex items-center">
    <button matIconButton aria-label="Toggle sidebar" (click)="handleToggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="ml-2 flex items-center gap-2 cursor-pointer" routerLink="/home">
      <div class="bg-indigo-600 text-white p-1.5 rounded-xl flex items-center justify-center">
        <mat-icon class="text-sm">groups</mat-icon>
      </div>
      <span class="text-slate-900 text-lg font-black tracking-tight">Vartahub</span>
    </div>
  </div>

  <!-- Center -->
  <nav class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-1 md:flex">
    <a
      routerLink="/home"
      routerLinkActive="text-indigo-600 bg-indigo-50/60 font-semibold"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
    >
      Home
    </a>

    <a
      routerLink="/instructors"
      routerLinkActive="text-indigo-600 bg-indigo-50/60 font-semibold"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
    >
      Instructors
    </a>

    <a
      routerLink="/schedule"
      routerLinkActive="text-indigo-600 bg-indigo-50/60 font-semibold"
      class="rounded-lg px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
    >
      Meetings
    </a>
  </nav>

  <!-- Right -->
  <div class="ml-auto flex items-center gap-1">
    <button matIconButton aria-label="Notifications">
      <mat-icon>notifications_none</mat-icon>
    </button>

    <button matIconButton aria-label="Profile" routerLink="/profile">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Sidebar -->
@if (toggleSidebar) {
  <!-- Backdrop -->
  <div class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs" (click)="handleToggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-white shadow-2xl">
    <!-- Header -->
    <div class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 px-4">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-1.5 rounded-xl flex items-center justify-center">
          <mat-icon class="text-sm">groups</mat-icon>
        </div>
        <span class="text-lg font-black tracking-tight text-slate-900">Vartahub</span>
      </div>

      <button matIconButton aria-label="Close sidebar" (click)="handleToggleSidebar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex flex-1 flex-col gap-1 p-3">
      <a
        routerLink="/home"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        (click)="handleToggleSidebar()"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>

      <a
        routerLink="/instructors"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        (click)="handleToggleSidebar()"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <mat-icon>school</mat-icon>
        <span>Instructors</span>
      </a>

      <a
        routerLink="/schedule"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        (click)="handleToggleSidebar()"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <mat-icon>video_call</mat-icon>
        <span>Meetings</span>
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        (click)="handleToggleSidebar()"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
        (click)="handleToggleSidebar()"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Bottom -->
    <div class="shrink-0 border-t border-slate-200 p-3">
      <button mat-stroked-button routerLink="/registration" class="flex! w-full! items-center! justify-center! gap-2! rounded-xl! border-slate-300! text-slate-700!">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </aside>
}
