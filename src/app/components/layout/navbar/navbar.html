<mat-sidenav-container class="z-50 bg-surface-container">

  <!-- Mobile Sidebar -->
  <mat-sidenav #sidenav mode="over" position="start" class="w-72! bg-surface">
    <div class="flex h-full flex-col">

      <!-- Sidebar Header -->
      <div class="flex h-16 shrink-0 items-center justify-between border-b border-outline-variant px-4">
        <div class="flex items-center gap-2">
          <mat-icon color="primary">groups</mat-icon>
          <span class="text-lg font-black tracking-tight">Vartahub</span>
        </div>

        <button matIconButton aria-label="Close sidebar" (click)="sidenav.close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Sidebar Navigation -->
      <mat-nav-list class="flex-1! px-2!">

        <!-- Home -->
        <a mat-list-item routerLink="/" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }" (click)="sidenav.close()">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Home</span>
        </a>

        <!-- Instructors -->
        <a mat-list-item routerLink="/instructor" routerLinkActive="selected" (click)="sidenav.close()">
          <mat-icon matListItemIcon>school</mat-icon>
          <span matListItemTitle>Instructors</span>
        </a>

        <!-- Meetings -->
        <a mat-list-item routerLink="/meeting" routerLinkActive="selected" (click)="sidenav.close()">
          <mat-icon matListItemIcon>video_call</mat-icon>
          <span matListItemTitle>Meetings</span>
        </a>

        <!-- Profile -->
        <a mat-list-item routerLink="/profile" routerLinkActive="selected" (click)="sidenav.close()">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Profile</span>
        </a>

        <!-- Settings -->
        <a mat-list-item routerLink="/settings" routerLinkActive="selected" (click)="sidenav.close()">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Settings</span>
        </a>
      </mat-nav-list>

      <!-- Sidebar Footer -->
      <div class="shrink-0 border-t border-outline-variant p-3">
        <button mat-stroked-button routerLink="/" class="w-full!" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>

    <!-- FIXED NAVBAR -->
    <mat-toolbar class="fixed left-0 right-0 top-0 z-9999 border-b! border-outline-variant! bg-surface!">

      <!-- Left -->
      <div class="flex items-center">

        <!-- Mobile Menu -->
        <button matIconButton aria-label="Toggle sidebar" class="md:hidden!" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>

        <!-- Logo -->
        <div class="ml-2 flex cursor-pointer items-center gap-2" routerLink="/">
          <mat-icon color="primary">groups</mat-icon>
          <span class="text-lg font-bold tracking-tight text-on-surface">
            Vartahub
          </span>
        </div>
      </div>

      <!-- Center Navigation -->

      <nav class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-1 md:flex" aria-label="Main navigation">

        <!-- Home -->
        <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon>home</mat-icon>
          Home
        </a>

        <!-- Instructors -->
        <a mat-button routerLink="/instructor" routerLinkActive="active">
          <mat-icon>school</mat-icon>
          Instructors
        </a>

        <!-- Meetings -->
        <a mat-button routerLink="/meeting" routerLinkActive="active">
          <mat-icon>groups</mat-icon>
          Meetings
        </a>
      </nav>

      <!-- Right -->

      <div class="ml-auto flex items-center gap-2">
        @if (keycloak.authenticated) {
          <button mat-button aria-label="Logout" (click)="logout()">
            <mat-icon>arrow_forward</mat-icon>
            <span>Logout</span>
          </button>

        } @else {
          <button mat-stroked-button aria-label="Get Started" (click)="register()">
            <mat-icon>arrow_forward</mat-icon>
            <span>Get Started</span>
          </button>
        }
      </div>
    </mat-toolbar>
  </mat-sidenav-content>
</mat-sidenav-container>
