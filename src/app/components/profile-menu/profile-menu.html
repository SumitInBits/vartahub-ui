<button mat-icon-button [matMenuTriggerFor]="profileMenu" aria-label="Open profile menu">
  <mat-icon>account_circle</mat-icon>
</button>

<mat-menu #profileMenu="matMenu" xPosition="before" class="rounded-2xl! min-w-56! p-2!">
  <!-- User info header inside menu -->
  <div class="px-4 py-3 border-b mb-2">
    <p class="text-sm font-bold">Alex Johnson</p>
    <p class="text-xs truncate">alex.johnson&#64;example.com</p>
  </div>

  <button mat-menu-item routerLink="/profile" class="rounded-xl! mb-1!">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>

  <!--  <button mat-menu-item routerLink="/profile/edit" class="rounded-xl! mb-1!">-->
  <!--    <mat-icon>settings</mat-icon>-->
  <!--    <span>Account Settings</span>-->
  <!--  </button>-->

  <div class="h-px bg-outline-variant my-1"></div>

  <button
    mat-menu-item
    (click)="logout()"
    class="rounded-xl! text-error hover:bg-error-container hover:text-on-error-container"
  >
    <mat-icon class="text-error!">logout</mat-icon>
    <span class="text-error">Logout</span>
  </button>
</mat-menu>
